<body data-page="messages">
  <header class="site-header">
    <a class="brand" href="index.html">Princess + Frog</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html">Home 🏠</a>
      <a href="letters.html">Open When Letters 💌</a>
      <a href="memories.html">Memory Wall 📸</a>
      <a href="badges.html">Badges 🏆</a>
      <a href="game.html">Game Room 🎮</a>
      <a href="movies.html">Movies 🎬</a>
      <a href="messages.html">Our Chat 💬</a>
      <a href="gifts.html">Gifts 🎁</a>
      <a href="quotes.html">Things We Said 🗣️</a>
      <a href="love.html">Love Notes 💕</a>
    </nav>
  </header>

  <main class="page messages-page">
    <section class="page-title">
      <p class="eyebrow">Just between us</p>
      <h1>Our Chat 💬</h1>
      <p>Leave a thought, a tiny update, or something sweet for the other person to find.</p>
    </section>

    <form class="message-composer" id="messageForm">
      <label class="message-sender">Sending as
        <select id="messageSender">
          <option value="frog">Frog 🐸</option>
          <option value="princess">Princess 👑</option>
        </select>
      </label>
      <label class="message-input">
        <span class="sr-only">Message</span>
        <textarea id="messageInput" maxlength="500" placeholder="Write something for your person…" required></textarea>
      </label>
      <div class="message-compose-footer">
        <small><span id="messageCount">0</span> / 500</small>
        <button class="btn primary" type="submit">Send 💕</button>
      </div>
    </form>

    <div class="message-live-row">
      <span class="presence-pill online"><i></i> Live shared board</span>
      <button class="btn quiet-btn" id="clearMessages" type="button">Clear all</button>
    </div>
    <section class="message-list" id="messageList" aria-live="polite"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260823-2"></script>
  <script src="auth.js?v=20260823-6"></script>
  <script src="script.js?v=20260824-2"></script>
  <script src="app-enhancements.js?v=20260824-2"></script>
  <script src="games-plus.js?v=20260824-2"></script>
  <script src="couple-hub.js?v=20260824-2"></script>
</body>
</html>
