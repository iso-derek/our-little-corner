<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Memory Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="memories">
  <header class="site-header">
    <a class="brand" href="index.html">Princess + Frog</a>
    <nav class="nav">
      <a href="index.html">Home 🏠</a>
      <a href="letters.html">Open When Letters 💌</a>
      <a href="memories.html">Memory Wall 📸</a>
      <a href="badges.html">Badges 🏆</a>
      <a href="game.html">Game Room 🎮</a>
      <a href="messages.html">Our Chat 💬</a>
      <a href="gifts.html">Gifts 🎁</a>
      <a href="quotes.html">Things We Said 🗣️</a>
      <a href="love.html">Love Notes 💕</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-title">
      <p class="eyebrow">Recent → Oldest</p>
      <h1>Memory Wall 📸</h1>
      <p>Our little gallery of days that deserve to be kept softly.</p>
    </section>
    <form class="collection-composer" id="memoryForm">
      <label>Memory title
        <input id="newMemoryTitle" type="text" maxlength="100" placeholder="Name this memory" required>
      </label>
      <label>Date
        <input id="newMemoryDate" type="text" maxlength="50" placeholder="Add a date">
      </label>
      <button class="btn primary" type="submit">Add memory</button>
    </form>
    <section class="memory-grid" id="memoryGrid"></section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image">×</button>
    <img src="" alt="">
    <p></p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js?v=20260819-4"></script>
</body>
</html>
