    <a class="brand" href="index.html">Princess + Frog</a>

    </nav>
  </header>

  <main class="page">
    <section class="page-title">
      <p class="eyebrow">Soft surprises</p>
      <h1>Gifts Corner 🎁💕</h1>
      <p>Little things I got for my princess because she deserves softness, surprises, and love.</p>
    </section>
    <div class="page-toolbar"><button class="manage-toggle" id="giftEditToggle" type="button" aria-pressed="false"><span aria-hidden="true">+</span> Edit gifts</button></div>
    <form class="collection-composer" id="giftForm" hidden>
      <label>Gift name
        <input id="newGiftTitle" type="text" maxlength="100" placeholder="Name this gift" required>
      </label>
      <label>Date
        <input id="newGiftDate" type="text" maxlength="50" placeholder="Add a date">
      </label>
      <button class="btn primary" type="submit">Add gift</button>
    </form>
    <section class="gift-grid" id="giftGrid"></section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Gift photo viewer" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close photo viewer">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo">&larr;</button>
    <figure><img src="" alt=""><figcaption><p></p><span class="lightbox-count"></span></figcaption></figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo">&rarr;</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
