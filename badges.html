  <main class="page">
    <section class="page-title">
      <p class="eyebrow">Tiny trophies</p>
      <h1>Achievement Badges 🏆</h1>
      <p>Create your own little wins, then tap a badge to unlock or lock it.</p>
    </section>

    <div class="page-toolbar"><button class="manage-toggle" id="badgeEditToggle" type="button" aria-pressed="false"><span aria-hidden="true">+</span> Edit badges</button></div>
    <form class="collection-composer badge-composer" id="badgeForm" hidden>
      <label>Icon
        <input id="badgeEmoji" type="text" maxlength="4" placeholder="🏆" required>
      </label>
      <label>Badge name
        <input id="badgeTitle" type="text" maxlength="80" placeholder="Our newest achievement" required>
      </label>
      <button class="btn primary" type="submit">Add badge</button>
    </form>
    <section class="progress-panel">
      <strong id="badgeProgressText">Unlocked 0 / 0 badges</strong>
      <div class="progress-track"><span id="badgeProgressBar"></span></div>
    </section>
    <section class="badge-grid" id="badgeGrid"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
