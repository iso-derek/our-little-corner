<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Achievement Badges</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="badges">
  <header class="site-header">
    <a class="brand" href="index.html">Princess + Frog</a>
    <nav class="nav">
      <a href="index.html">Home 🏠</a>
      <a href="letters.html">Open When Letters 💌</a>
      <a href="memories.html">Memory Wall 📸</a>
      <a href="badges.html">Badges 🏆</a>
      <a href="game.html">Game Room 🎮</a>
      <a href="messages.html">Our Chat 💬</a>
      <a href="gifts.html">Gifts 🎁</a>
      <a href="quotes.html">Things We Said 🗣️</a>
      <a href="love.html">Love Notes 💕</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-title">
      <p class="eyebrow">Tiny trophies</p>
      <h1>Achievement Badges 🏆</h1>
      <p>Create your own little wins, then tap a badge to unlock or lock it.</p>
    </section>

    <form class="collection-composer badge-composer" id="badgeForm">
      <label>Icon
        <input id="badgeEmoji" type="text" maxlength="4" placeholder="🏆" required>
      </label>
      <label>Badge name
        <input id="badgeTitle" type="text" maxlength="80" placeholder="Our newest achievement" required>
      </label>
      <button class="btn primary" type="submit">Add badge</button>
    </form>
    <section class="progress-panel">
      <strong id="badgeProgressText">Unlocked 0 / 0 badges</strong>
      <div class="progress-track"><span id="badgeProgressBar"></span></div>
    </section>
    <section class="badge-grid" id="badgeGrid"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js?v=20260819-5"></script>
</body>
</html>
